<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Myanmar Sign Language (MSL) Live Translator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      width: 100%;
      max-width: 1040px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
    header span { color: var(--accent); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--danger);
    }
    .dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }

    .grid {
      width: 100%;
      max-width: 1040px;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 20px;
    }

    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #020617;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Natural selfie mirror */
    }

    .overlay-pill {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      color: var(--text);
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.92rem;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: #0f172a; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-secondary {
      background: #334155;
      color: var(--text);
    }

    .prediction-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
    }

    .myanmar-char {
      font-size: 5.5rem;
      line-height: 1.15;
      font-weight: 700;
      color: var(--accent);
      min-height: 105px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .label-sub {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .bars { display: flex; flex-direction: column; gap: 10px; }

    .bar-row { display: flex; flex-direction: column; gap: 4px; }
    .bar-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .bar-track {
      width: 100%;
      height: 8px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.15s ease;
    }

    .transcript-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      min-height: 54px;
      font-size: 1.4rem;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <header>
    <h1>Myanmar Sign Language <span>Live Translator</span></h1>
    <div class="badge">
      <span class="dot" id="apiDot"></span>
      <span id="apiStatus">Checking API...</span>
    </div>
  </header>

  <main class="grid">
    <!-- Left: Camera Feed -->
    <section class="card">
      <div class="video-wrap">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="overlay-pill" id="camStatus">Camera Off</div>
      </div>

      <div class="controls">
        <button class="btn-primary" id="startBtn">Start Camera</button>
        <button class="btn-danger" id="stopBtn" disabled>Stop</button>
        <button class="btn-secondary" id="addCharBtn" disabled>+ Add Sign to Text</button>
      </div>

      <p class="hint">
        Tip: Hold a steady hand sign (<strong>က</strong>, <strong>ခ</strong>, or <strong>ဂ</strong>) inside the frame.
        Press <strong>Spacebar</strong> or click <strong>+ Add Sign to Text</strong> to append the detected character.
      </p>
    </section>

    <!-- Right: Live Prediction & Sentence Builder -->
    <section class="card">
      <div class="prediction-box">
        <div class="myanmar-char" id="charDisplay">—</div>
        <div class="label-sub" id="romanDisplay">Waiting for hand...</div>
      </div>

      <div class="bars">
        <div class="bar-row">
          <div class="bar-head"><span>က (ka)</span><span id="prob-ka">0%</span></div>
          <div class="bar-track"><div class="bar-fill" id="bar-ka"></div></div>
        </div>
        <div class="bar-row">
          <div class="bar-head"><span>ခ (kha)</span><span id="prob-kha">0%</span></div>
          <div class="bar-track"><div class="bar-fill" id="bar-kha"></div></div>
        </div>
        <div class="bar-row">
          <div class="bar-head"><span>ဂ (ga)</span><span id="prob-ga">0%</span></div>
          <div class="bar-track"><div class="bar-fill" id="bar-ga"></div></div>
        </div>
      </div>

      <div>
        <div class="bar-head" style="margin-bottom: 6px;">
          <span>Composed Myanmar Text</span>
          <span id="latencyText">Latency: —</span>
        </div>
        <div class="transcript-box">
          <span id="transcript"></span>
          <div style="display: flex; gap: 6px;">
            <button class="btn-secondary" id="copyBtn" style="padding: 6px 10px; font-size: 0.8rem;">Copy</button>
            <button class="btn-secondary" id="clearBtn" style="padding: 6px 10px; font-size: 0.8rem;">Clear</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <canvas id="captureCanvas" width="480" height="360" style="display: none;"></canvas>

  <script>
    const video = document.getElementById("webcam");
    const canvas = document.getElementById("captureCanvas");
    const ctx = canvas.getContext("2d");

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const addCharBtn = document.getElementById("addCharBtn");
    const camStatus = document.getElementById("camStatus");

    const charDisplay = document.getElementById("charDisplay");
    const romanDisplay = document.getElementById("romanDisplay");
    const latencyText = document.getElementById("latencyText");
    const transcriptEl = document.getElementById("transcript");

    let stream = null;
    let loopTimer = null;
    let inFlight = false;
    let currentDetectedChar = "";

    // 1. Check FastAPI /health on page load
    async function checkHealth() {
      const dot = document.getElementById("apiDot");
      const status = document.getElementById("apiStatus");
      try {
        const res = await fetch("/health");
        if (res.ok) {
          dot.classList.add("online");
          status.textContent = "API Online";
        } else {
          status.textContent = "API Error";
        }
      } catch {
        status.textContent = "API Offline";
      }
    }
    checkHealth();

    // 2. Start webcam & frame inference loop
    startBtn.addEventListener("click", async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: "user" },
          audio: false,
        });
        video.srcObject = stream;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        addCharBtn.disabled = false;
        camStatus.textContent = "Live • Detecting...";

        loopTimer = setInterval(sendFrameForPrediction, 250);
      } catch (err) {
        alert("Could not access webcam: " + err.message);
      }
    });

    // 3. Stop webcam
    stopBtn.addEventListener("click", () => {
      if (loopTimer) clearInterval(loopTimer);
      if (stream) stream.getTracks().forEach((t) => t.stop());
      video.srcObject = null;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      addCharBtn.disabled = true;
      camStatus.textContent = "Camera Off";
      charDisplay.textContent = "—";
      romanDisplay.textContent = "Camera stopped";
      currentDetectedChar = "";
    });

    // 4. Mirror frame onto hidden canvas (to match training orientation) and POST to /predict/image
    async function sendFrameForPrediction() {
      if (inFlight || !video.videoWidth) return;
      inFlight = true;
      const t0 = performance.now();

      try {
        ctx.save();
        ctx.scale(-1, 1);
        ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
        ctx.restore();

        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.8));
        const formData = new FormData();
        formData.append("file", blob, "frame.jpg");

        const res = await fetch("/predict/image", { method: "POST", body: formData });
        const ms = Math.round(performance.now() - t0);
        latencyText.textContent = `Latency: ${ms} ms`;

        if (!res.ok) {
          // 422 / 400 when no hand is detected in frame
          charDisplay.textContent = "—";
          romanDisplay.textContent = "No hand detected";
          currentDetectedChar = "";
          updateBars({});
          return;
        }

       const data = await res.json();

        if (!data.hand_detected) {
          currentDetectedChar = "";
          charDisplay.textContent = "—";
          romanDisplay.textContent = "No hand detected";
          updateBars({});
          return;
        }

        const labelText = (data.label_id || "").toUpperCase();
        const confPct = Math.round((data.confidence || 0) * 100);

        if (confPct >= 60 && data.myanmar_char) {
          currentDetectedChar = data.myanmar_char;
          charDisplay.textContent = data.myanmar_char;
          romanDisplay.textContent = `${labelText} • ${confPct}% confidence`;
        } else {
          currentDetectedChar = "";
          charDisplay.textContent = "?";
          romanDisplay.textContent = `Low confidence (${confPct}%)`;
        }

        updateBars(data.probabilities || {});
      } catch (err) {
        console.error(err);
      } finally {
        inFlight = false;
      }
    }

    function updateBars(probs) {
      ["ka", "kha", "ga"].forEach((key) => {
        const pct = Math.round((probs[key] || 0) * 100);
        document.getElementById(`prob-${key}`).textContent = `${pct}%`;
        document.getElementById(`bar-${key}`).style.width = `${pct}%`;
      });
    }

    function appendCurrentSign() {
      if (currentDetectedChar) {
        transcriptEl.textContent += currentDetectedChar;
      }
    }

    addCharBtn.addEventListener("click", appendCurrentSign);
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" && !addCharBtn.disabled) {
        e.preventDefault();
        appendCurrentSign();
      }
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      transcriptEl.textContent = "";
    });

    document.getElementById("copyBtn").addEventListener("click", () => {
      if (transcriptEl.textContent) {
        navigator.clipboard.writeText(transcriptEl.textContent);
      }
    });
  </script>
</body>
</html>
